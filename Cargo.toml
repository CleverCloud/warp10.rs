[package]
name          = "warp10"
version       = "3.0.0"
edition       = "2024"
rust-version  = "1.88.0"
authors       = ["Marc-Antoine Perennou <marc-antoine.perennou@clever-cloud.com>", "Rémi COLLIGNON <remi.collignon-ducret@clever-cloud.com>"]
description   = "Warp10 client for rust"
repository    = "https://github.com/CleverCloud/warp10.rs"
documentation = "https://docs.rs/warp10/"
readme        = "README.md"
keywords      = ["warp10", "time-series"]
categories    = ["api-bindings", "database"]
license       = "BSD-3-Clause"

[dependencies]
percent-encoding = "2"
reqwest          = { version = "0.12", default-features = false, features = ["json"] }
serde_json       = "1"
time             = "0.3"
url              = "2"
serde            = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
env_logger = "0.11"
log = "0.4"
testcontainers = { version = "0.23", features = ["http_wait"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default    = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
